# =============================================================================
# PESI RILEVANZA
# =============================================================================

relevance_weights:
  title_match: 3.5
  abstract_match: 2.0
  keyword_match: 2.5
  citation_count: 1.5
  recency: 1.0
  recency_penalty_per_year: 0.1
  source_tier:
    neurips: 2.5
    icml: 2.5
    iclr: 2.5
    cvpr: 1.8
    iccv: 1.8
    eccv: 1.5
    aaai: 1.5
    ijcai: 1.5
    kdd: 1.8
    www: 1.5
    arxiv: 1.0
    kdnuggets: 0.7
    paperswithcode: 1.2
    semantic_scholar: 1.0

# =============================================================================
# CONFIGURAZIONE SORGENTI
# =============================================================================

sources:
  scientific:
    - name: "arXiv"
      base_url: "http://export.arxiv.org/api/query"
      weight: 1.0
      categories:
        - cs.AI
        - cs.LG
        - cs.CL
        - cs.CV
        - cs.RO
        - cs.SE
        - cs.CR
        - cs.DB
        - cs.DC
        - cs.DS
        - stat.ML
        - stat.AP
    - name: "OpenReview"
      base_url: "https://api.openreview.net/notes"
      weight: 1.2
      conferences: ["ICLR", "NeurIPS", "ICML"]
      years: [2024, 2025]
  industry:
    - name: "KDnuggets"
      type: "rss_blog"
      weight: 0.8
      feeds:
        - "https://www.kdnuggets.com/feed"
    - name: "PapersWithCode"
      type: "api"
      base_url: "https://paperswithcode.com/api/v1"
      weight: 1.2
  academic_aggregators:
    - name: "SemanticScholar"
      base_url: "https://api.semanticscholar.org/graph/v1"
      weight: 1.1
